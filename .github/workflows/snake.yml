name: generate snake

# Animated contribution "snake" (umenzi-style), built on the public
# Platane/snk action — no source-repo files need to be copied for this one.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Default (the workflow's own token) only ever sees public
          # contribution data. Passing a personal token that belongs to the
          # profile owner makes snk report the same totals the owner sees
          # on their own dashboard, private repos included — no public
          # "include private contributions" profile setting required.
          github_token: ${{ secrets.ACCESS_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
